hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  dataset_root: "abcd-big"
  transform: ABCDConfigToTensor
  scaler:
    name: ABCDConfigScaler
    args:
      n_max: 10000
  val_ratio: 0.10
  test_ratio: 0.10
  batch_size: 64
  num_workers: 0

models:
  graph:
    cls: GPSEncoder
    attn_type: performer
    hidden_dim: 64
    num_layers: 2
    num_heads: 4
    embedding_dim: 64
    output_dim: 9
    dropout: 0.1
    attn_dropout: 0.1
    # GNN_ENCODER_IDEAS.md idea 3: learned soft-clustering pool, no ground-truth community labels
    # used -- see GPSEncoder docstring / gps_encoder.py. num_clusters is a budget the model can
    # under-use (usage-entropy aux loss lets it discover how many of these a graph actually
    # needs), not a claim that every ABCD graph has exactly this many communities -- set well
    # above the largest community count you expect to see, not at a "typical" value.
    num_clusters: 128
    # Quantile levels read off the per-slot soft cluster sizes in GPSEncoder._cluster_pool,
    cluster_size_quantiles:
      [0.01, 0.05, 0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9, 0.95, 0.99]
  theta:
    cls: ConfigAutoEncoder
    input_dim: 9
    hidden_dims: [128, 64, 32]
    embedding_dim: ${models.graph.embedding_dim}

training:
  wrapper: supcon
  accelerator: gpu
  devices: [0]
  max_epochs: 200
  aux_weight: 0.1 # weight on the cluster-assignment entropy loss (idea 3)
  losses:
    reg:
      name: abcd_constraint
      args:
        lambda_penalty: 1.0
        # weight_i = 1 + clip(regr_R2 - cross_R2, 0, 1) from the
        # 2kolqt2w (gps-ae-supcon) baseline's test/regression_metrics table, in ABCD_CONFIG_KEYS
        # order [n, t1, t2, xi, c_min, c_max, d_min, d_max, nout]. Biggest boost on t2 (largest
        # regr->cross gap, 0.96) and c_max (0.44); n/t1/c_min/nout/d_max stay close to 1.0 since
        # their gap was small (their old bad *absolute* R2 was a scaler problem, already fixed
        # separately -- see scripts/check_config_scaling.py -- not re-litigated here).
        weights: [1.028, 1.068, 1.959, 1.320, 1.034, 1.435, 1.473, 1.138, 1.029]
    repr:
      name: supcon
      weight: 0.3
      args:
        temperature: 0.07
        tau_dist: 1.0
        bidirectional: true
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: gps-ae-supcon-cluster-pool
    tags:
      [gps, community-features, abcd-constraint, bidirectional, batch64, cluster-pool, reweighted]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 5
    - name: model_summary
      max_depth: -1
