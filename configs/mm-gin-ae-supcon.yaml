hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  dataset_root: "abcd-big"
  transform: ABCDConfigToTensor
  scaler:
    name: ABCDConfigScaler
    args:
      n_max: 10000 # upper bound for all node-count-dependent scaler features
  val_ratio: 0.10
  test_ratio: 0.10
  batch_size: 64
  num_workers: 0

models:
  graph:
    cls: GINEncoder
    hidden_dims: [64, 128]
    embedding_dim: 32
    output_dim: 9
  theta:
    cls: ConfigAutoEncoder
    input_dim: 9
    hidden_dims: [16]
    embedding_dim: ${models.graph.embedding_dim}

training:
  wrapper: supcon
  accelerator: gpu
  devices: [0] # must be a list of GPU indices, e.g. [0] or [1]; integer form is not supported
  max_epochs: 200
  losses:
    reg:
      name: abcd_constraint
      args:
        lambda_penalty: 1.0
      # name: mse
      # args: {}
    repr:
      name: supcon
      weight: 0.3
      args:
        temperature: 0.07
        tau_dist: 1.0
        bidirectional: true
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: mm-gin-ae-supcon
    tags: [big-dataset, fixed-supcon, tiny-mlp]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 5
    - name: model_summary
      max_depth: -1
