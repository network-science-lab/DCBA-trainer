hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  dataset_root: "abcd-big"
  transform: ABCDConfigToTensor
  scaler:
    name: ABCDNMaxConfigScaler
  val_ratio: 0.10
  test_ratio: 0.10
  # BaselineConfig computes structural statistics (communities, degrees) per graph and cannot
  # be run on a batch of several disjoint graphs collated into one -- must stay 1.
  batch_size: 1
  num_workers: 0

training:
  wrapper: baseline
  accelerator: cpu
  devices: 1
  # The baseline has no learnable parameters: max_epochs=0 makes Trainer.fit a no-op (it never
  # touches a training batch) and num_sanity_val_steps=0 skips the pre-fit validation sanity
  # check. Only Trainer.test, run further down in dcba.training.trainer.train, does real work.
  max_epochs: 0
  num_sanity_val_steps: 0
  baseline:
    detect_communities: false
    leiden_resolution: 1.0
    leiden_seed: 42
    d_max_iter: 1000
    c_max_iter: 1000
    natural_cutoff: false
  logger:
    project: dcba
    name: baseline-gt-communities
    tags: [baseline, heuristic, ground-truth-communities, abcd-big]
