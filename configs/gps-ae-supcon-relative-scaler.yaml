hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  dataset_root: "abcd-big"
  transform: ABCDConfigToTensor
  scaler:
    # ABCDRelativeConfigScaler vs ABCDConfigScaler (used in gps-ae-supcon-output-weights.yaml) is
    # the only intended difference between this config and that one -- keep everything else in
    # sync so the comparison isolates the scaler change. See ABCDRelativeConfigScaler's docstring
    # (dcba/dataset/transforms.py): size-like features are scaled against hard-constraint anchors
    # readable from the graph itself (c_max/n, d_max/n, log(d_min)/log(d_max),
    # log1p(nout)/log1p(n)) instead of fixed dataset-measured absolute bounds.
    name: ABCDRelativeConfigScaler
    args:
      n_max: 10000
  val_ratio: 0.10
  test_ratio: 0.10
  batch_size: 64
  num_workers: 0

models:
  graph:
    cls: GPSEncoder
    attn_type: performer
    hidden_dim: 64
    num_layers: 2
    num_heads: 4
    embedding_dim: 64
    output_dim: 9
    dropout: 0.1
    attn_dropout: 0.1
    # GNN_ENCODER_IDEAS.md idea 3: learned soft-clustering pool, no ground-truth community labels
    # used -- see GPSEncoder docstring / gps_encoder.py. num_clusters is a budget the model can
    # under-use (usage-entropy aux loss lets it discover how many of these a graph actually
    # needs), not a claim that every ABCD graph has exactly this many communities -- set well
    # above the largest community count you expect to see, not at a "typical" value.
    num_clusters: 128
    # Quantile levels read off the per-slot soft cluster sizes in GPSEncoder._cluster_pool,
    cluster_size_quantiles:
      [0.01, 0.05, 0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9, 0.95, 0.99]
  theta:
    cls: ConfigAutoEncoder
    input_dim: 9
    hidden_dims: [128, 64, 32]
    embedding_dim: ${models.graph.embedding_dim}

training:
  wrapper: supcon
  accelerator: gpu
  devices: [0]
  max_epochs: 200
  aux_weight: 0.1 # weight on the cluster-assignment entropy loss (idea 3)
  losses:
    reg:
      name: abcd_constraint
      args:
        lambda_penalty: 1.0
        # 'raw' compares the ABCD generator's validity conditions (d_min <= d_max, c_max <= n,
        # d_max <= n, nout <= n) in raw scale, denormalising predictions through this config's
        # scaler (attached automatically by the training entry point) and dividing violations by
        # the sample's raw n so the hinge stays O(1). The legacy 'scaled' mode is wrong under
        # this scaler (falsely fires on 20-59% of valid configs -- features live on incomparable
        # scales). See ABCDConstraintPenaltyLoss's docstring and .analysis/scaler.md.
        ordering_penalties: raw
        # Same weights as gps-ae-supcon-output-weights.yaml -- kept fixed so this run isolates the
        # scaler change. Re-derive with scripts/derive_output_weights.py against this run's own
        # regression_metrics table once trained, rather than reusing weights measured under the
        # other scaler.
        weights: [1.028, 1.068, 1.959, 1.320, 1.034, 1.435, 1.473, 1.138, 1.029]
    repr:
      name: supcon
      weight: 0.3
      args:
        temperature: 0.07
        tau_dist: 1.0
        bidirectional: true
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: gps-ae-supcon-relative-scaler
    tags:
      [
        gps,
        community-features,
        abcd-constraint,
        bidirectional,
        batch64,
        cluster-pool,
        reweighted,
        relative-scaler,
      ]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 5
    - name: model_summary
      max_depth: -1
