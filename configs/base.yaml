hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  report_path: ??? # must be overridden at runtime
  n_max: 10000 # upper bound for all node-count-dependent scaler features
  val_ratio: 0.1
  test_ratio: 0.1
  batch_size: 32
  num_workers: 0

model:
  input_dim: 9
  hidden_dims: [64]
  embedding_dim: 32

training:
  wrapper: config_autoencoder
  accelerator: gpu
  devices: [0]
  max_epochs: 100
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: config-autoencoder
    tags: [phase-1]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 20
    - name: model_summary
      max_depth: -1
