hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  report_path: "abcd-interim/report.json"
  n_max: 10000 # upper bound for all node-count-dependent scaler features
  val_ratio: 0.10
  test_ratio: 0.10
  batch_size: 16 # small enough for interim dataset; scale to ~256 (K>=32 configs x N graphs) for production
  num_workers: 0

models:
  graph:
    cls: GINEncoder
    input_dim: 1
    hidden_dims: [64, 128]
    embedding_dim: 32
    output_dim: 9
  theta:
    cls: ConfigAutoEncoder
    input_dim: 9
    hidden_dims: [128, 64]
    embedding_dim: 32 # must match models.graph.embedding_dim

training:
  wrapper: supcon
  accelerator: gpu
  devices: [0]
  max_epochs: 200
  losses:
    reg:
      name: abcd_constraint
      args:
        lambda_penalty: 1.0
      # name: mse
      # args: {}
    repr:
      name: supcon
      weight: 1.0
      args:
        temperature: 0.07
        tau_dist: 1.0
        bidirectional: true
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: mm-supcon
    tags: [supcon, abcd-constraint, expand-compress-gnn, bidirectional, deeper-theta]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 20
    - name: gradient_accumulation_scheduler
      gradient_scheduling: 4 # effective batch = gradient_scheduling * batch_size = 4 * 16 = 64
    - name: model_summary
      max_depth: -1
