hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  report_path: "abcd-interim/report.json"
  # report_path: "test/dataset_abcd/report.json"
  n_max: 10000 # upper bound for all node-count-dependent scaler features
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 2
  num_workers: 0

model:
  input_dim: 1
  hidden_dims: [64, 128]
  embedding_dim: 32
  output_dim: 9

training:
  wrapper: config_autoencoder
  model_cls: GraphEncoder
  accelerator: gpu
  devices: [0]
  max_epochs: 100
  loss:
    name: mse
    args: {}
  # To use the constraint-penalty loss:
  # loss:
  #   name: abcd_constraint
  #   args:
  #     lambda_penalty: 1.0
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: gnn-autoencoder
    tags: [phase-1]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 20
    - name: gradient_accumulation_scheduler
      gradient_scheduling: 4
    - name: model_summary
      max_depth: -1
