program: src/dcba/entrypoint.py
command:
  - uv
  - run
  - python
  - ${program}
  - --config-name
  - gnn-encoder
  - ${args_no_hyphens}
project: dcba

method: bayes

metric:
  name: val_loss
  goal: minimize

parameters:
  models.graph.hidden_dims:
    values:
      - [64]
      - [64, 128]
      - [128, 128]
      - [128, 256]
      - [64, 128, 256]

  models.graph.embedding_dim:
    values: [16, 32, 64]

  training.losses.reg.args.lambda_penalty:
    values: [0.1, 0.5, 1.0, 2.0]

  training.optimizer.args.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01

  training.optimizer.args.weight_decay:
    distribution: log_uniform_values
    min: 0.0000001
    max: 0.001
