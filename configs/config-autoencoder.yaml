hydra:
  run:
    dir: .trainings/${now:%Y-%m-%d}/${now:%H-%M-%S}

random_seed: 42

data:
  report_path: "abcd-interim/report.json"
  # report_path: "test/dataset_abcd/report.json"
  n_max: 10000 # upper bound for all node-count-dependent scaler features
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 8
  num_workers: 0

models:
  theta:
    cls: ConfigAutoEncoder
    input_dim: 9
    hidden_dims: [64]
    embedding_dim: 32

training:
  wrapper: config_autoencoder
  accelerator: gpu
  devices: [0]
  max_epochs: 100
  losses:
    reg:
      name: mse
      args: {}
  # To use the constraint-penalty loss:
  # losses:
  #   reg:
  #     name: abcd_constraint
  #     args:
  #       lambda_penalty: 1.0
  optimizer:
    name: AdamW
    args:
      lr: 0.001
      weight_decay: 0.00001
  logger:
    project: dcba
    name: config-autoencoder
    tags: [phase-1]
  callbacks:
    - name: model_checkpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      verbose: true
    - name: early_stopping
      monitor: val_loss
      mode: min
      patience: 20
    - name: model_summary
      max_depth: -1
