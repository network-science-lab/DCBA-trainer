[project]
name = "dcba"
version = "0.13.0"
description = "Graph configuration retrieval: recover ABCD generator parameters from a given graph via contrastive learning."
readme = "README.md"
authors = [
    {name = "Michał Czuba"},
    {name = "Mateusz Stolarski"},
    {name = "Łukasz Kraiński"},
]
requires-python = ">=3.12"
dependencies = [
    "dcba-data-set",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "matplotlib>=3.8",
    "omegaconf>=2.3.0",
    "pyg-lib>=0.4.0", # comment for cpu
    "python-dotenv>=1.2.2",
    "torch~=2.5.1",
    "torch-geometric>=2.5",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "wandb>=0.25.1",
    "numpy>=2.0.2",
    "matplotlib>=3.11.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "tqdm>=4.66.6",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[project.scripts]
dcba-train = "dcba.entrypoint:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Suppress known third-party warnings that cannot be fixed in this codebase:
# - torch_geometric 2.7.0 bug: llm/utils/backend_utils.py still imports from
#   torch_geometric.distributed, which emits a deprecation warning since 2.7.0.
#   No newer release is available to upgrade to.
# - wandb 0.25.1 bug: sentry.py uses a deprecated Scope.user setter and app_url
#   utility from the sentry-sdk. 0.25.1 is the latest release available.
filterwarnings = [
    "ignore:.*torch_geometric\\.distributed.*has been deprecated:DeprecationWarning",
    "ignore:.*`Scope\\.user`.*deprecated.*`Scope\\.set_user\\(\\)`:DeprecationWarning",
    "ignore:.*`app_url`.*setting.*Settings object:DeprecationWarning",
]
addopts = "-m 'not wandb'"
markers = ["wandb: marks tests that require a live wandb connection (deselected by default)"]

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.5.1+cu121.html",
    # "https://data.pyg.org/whl/torch-2.5.1+cpu.html", # for cpu
]
no-build-package = ["torch-scatter", "torch-sparse", "pyg-lib"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
dcba-data-set = { path = "../DCBA-data-set", editable = true }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
# url = "https://download.pytorch.org/whl/cpu" # for cpu
explicit = true
